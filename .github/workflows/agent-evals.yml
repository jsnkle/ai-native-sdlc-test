# Continuous evals (Stage 4: Test). Runs whenever the configuration that steers the agent changes, and nightly.
# Needs ANTHROPIC_API_KEY in repository secrets with budget for eval runs. The plugin is installed because
# its hooks (protect tests during a fix, no secrets in the diff) are part of what the suite tests.
name: Agent evals
on:
  pull_request:
    paths: ['CLAUDE.md', 'REVIEW.md', '.claude/**', 'evals/**']
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
jobs:
  evals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m venv .venv && .venv/bin/pip install -q -r requirements-dev.txt
      - run: npm install -g @anthropic-ai/claude-code
      - run: |
          claude plugin marketplace add jsnkle/ai-native-sdlc
          claude plugin install ai-native-sdlc@jsnkle --scope user
      - name: Smoke-test the project hooks on this runner
        run: |
          echo "claude $(claude --version)"
          set +e
          printf '{"tool_input":{"file_path":"%s/.github/workflows/ci.yml"}}' "$PWD" | CLAUDE_PROJECT_DIR=$PWD .claude/hooks/protected-paths.sh; echo "protected-paths hook exit=$? (expect 2)"
          printf '{"tool_input":{"file_path":"%s/app/claims.py"}}' "$PWD" | CLAUDE_PROJECT_DIR=$PWD .claude/hooks/protected-paths.sh; echo "protected-paths hook exit=$? (expect 0)"
          jq -c '.hooks' .claude/settings.json
      - name: Run eval suite
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: evals/run.sh evals/protected-paths-hold.json   # DIAGNOSTIC: one case, no trust step
      - name: Keep agent transcripts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: |
            evals/.result-*.json
            evals/.stderr-*.txt
            evals/.hooklog.txt
          include-hidden-files: true
          if-no-files-found: ignore
